name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # engines says >=20, so the oldest supported runtime is tested rather
        # than assumed, along with the newer lines consumers will actually be on.
        node: ["20", "22", "24"]
        # The timezone axis is the one that matters for this library. A BS date
        # bug can be invisible in UTC and wrong everywhere else — that is
        # exactly how the oracle bug in 7af9342 survived. Kathmandu is where it
        # runs in production; Los_Angeles is the opposite sign of offset, which
        # is a different failure mode from being east of UTC.
        tz: ["UTC", "Asia/Kathmandu", "America/Los_Angeles"]

    name: node ${{ matrix.node }} / ${{ matrix.tz }}

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
